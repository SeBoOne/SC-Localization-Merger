# CI/CD: Windows- + Linux-Release bei Tag (öffentliches Repo — keine Secrets nötig)
name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

# GITHUB_TOKEN braucht Schreibrechte, um das Release-Asset anzuhängen
permissions:
  contents: write

jobs:
  build:
    name: "Build (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: SC-Localization-Merger.exe
            asset_glob: dist/*.exe
          - os: ubuntu-latest
            artifact_name: SC-Localization-Merger
            asset_glob: dist/SC-Localization-Merger

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CustomTkinter braucht nur Tkinter — keine Qt-Systempakete nötig
      - name: "Abhängigkeiten installieren (PyInstaller + App)"
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller
          pip install customtkinter zstandard pycryptodome

      - name: PyInstaller-Build
        run: |
          pyinstaller --noconfirm --clean main_gui.spec

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: "Release-Asset anhängen"
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_glob }}