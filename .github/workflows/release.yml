# CI/CD: Windows-Release bei Tag/Release (öffentliches Repo — keine Secrets nötig)
name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

jobs:
  build-windows:
    name: Windows-Build
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller
          pip install PySide6 zstandard pycryptodome

      - name: PyInstaller-Build
        run: |
          pyinstaller --noconfirm --clean main_gui.spec

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SC_GlobalIni_Merger
          path: dist/SC_GlobalIni_Merger.exe

      - name: Release-Asset anhängen
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
